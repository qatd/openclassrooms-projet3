info:
  name: rentals create
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/rentals"
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Maison test
      - name: surface
        type: text
        value: "50"
      - name: price
        type: text
        value: "120"
      - name: description
        type: text
        value: Une maison de test créée depuis Bruno
      - name: picture
        type: file
        value: []
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
